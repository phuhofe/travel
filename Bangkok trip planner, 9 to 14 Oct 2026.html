<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bangkok trip planner, 9 to 14 Oct 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#E6ECF1;
  --surface:#FFFFFF;
  --ink:#14202B;
  --muted:#586979;
  --rule:#C3CED8;
  --head:#14202B;
  --head-ink:#F2F6F9;
  --head-mute:#A9BAC9;
  --blue:#1F4E9E;
  --on-blue:#FFFFFF;
  --green:#5BA21B;
  --red:#C0102B;
  --amber:#E3A800;
  --teal:#00859B;
  --warn-bg:#FCE8EB;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D151E;
    --surface:#16212C;
    --ink:#E7EDF2;
    --muted:#9BACBB;
    --rule:#2B3A49;
    --head:#0A1119;
    --head-ink:#E7EDF2;
    --head-mute:#8DA0B1;
    --blue:#7FAAF2;
    --on-blue:#0D151E;
    --green:#8BCB4A;
    --red:#FF7487;
    --amber:#F2B705;
    --teal:#3FC1D6;
    --warn-bg:#3A1A22;
  }
}
:root[data-theme="dark"]{
  --paper:#0D151E;
  --surface:#16212C;
  --ink:#E7EDF2;
  --muted:#9BACBB;
  --rule:#2B3A49;
  --head:#0A1119;
  --head-ink:#E7EDF2;
  --head-mute:#8DA0B1;
  --blue:#7FAAF2;
  --on-blue:#0D151E;
  --green:#8BCB4A;
  --red:#FF7487;
  --amber:#F2B705;
  --teal:#3FC1D6;
  --warn-bg:#3A1A22;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:15px/1.45 'Sarabun',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html[lang="th"] body{line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.shell{max-width:1480px;margin:0 auto;padding:20px 18px 48px}

/* top */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
h1{
  margin:0;
  font-family:'Bricolage Grotesque','Sarabun',system-ui,sans-serif;
  font-weight:700;
  font-size:clamp(26px,4vw,40px);
  line-height:1.05;
  letter-spacing:-.02em;
}
.sub{margin:6px 0 0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  border:1px solid var(--rule);
  background:var(--surface);
  border-radius:8px;
  padding:8px 14px;
  font-weight:500;
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn[disabled]{opacity:.45;cursor:default}

.hint{
  margin:16px 0 18px;
  padding:10px 14px;
  border-left:4px solid var(--blue);
  background:var(--surface);
  border-radius:0 8px 8px 0;
  color:var(--muted);
  display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;
}
.legend{display:inline-flex;align-items:center;gap:8px}
.swatch{width:12px;height:12px;border-radius:50%;display:inline-block}
.swatch.core{background:var(--blue)}
.swatch.opt{border:2px dashed var(--muted);background:var(--surface)}

.lang{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;padding:8px 12px;font-weight:500}
.lang button+button{border-left:1px solid var(--rule)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start}
.pool-wrap{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;border-radius:12px}
@media (max-width:1040px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .pool-wrap{position:static;max-height:none;overflow:visible}
}
@media (max-width:420px){
  .shell{padding:14px 10px 40px}
  .days{grid-template-columns:minmax(0,1fr)}
}

/* day column */
.day{
  background:var(--surface);
  border:1px solid var(--rule);
  border-radius:12px;
  overflow:hidden;
}
.day.pool{border-style:dashed;border-width:2px}
.day-h{background:var(--head);color:var(--head-ink);padding:12px 14px 12px}
.pool .day-h{background:transparent;color:var(--ink);border-bottom:2px dashed var(--rule)}
.dnum{display:flex;align-items:center;gap:10px}
.dnum .n{
  font-family:'Bricolage Grotesque','Sarabun',system-ui,sans-serif;
  font-weight:700;font-size:40px;line-height:1;letter-spacing:-.03em;
}
.dnum .m{display:flex;flex-direction:column;font-size:13px;line-height:1.2;color:var(--head-mute)}
.dnum .m b{font-weight:600;color:var(--head-ink);font-size:15px}
.day-h h2{
  margin:8px 0 0;
  font-family:'Bricolage Grotesque','Sarabun',system-ui,sans-serif;
  font-weight:500;font-size:18px;line-height:1.25;
}
.pool .day-h h2{margin-top:0;font-size:22px;font-weight:700}
.stay,.dnote{margin:4px 0 0;font-size:13px;color:var(--head-mute)}
.pool .dnote{color:var(--muted)}
.day-tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mini{
  background:transparent;
  border:1px solid currentColor;
  color:inherit;
  border-radius:6px;
  padding:3px 9px;
  font-size:12.5px;
  opacity:.85;
}
.mini:hover{opacity:1}
.day-h .mini{color:var(--head-ink);border-color:var(--head-mute)}
.pool .day-h .mini{color:var(--ink);border-color:var(--rule)}

/* stops */
.stops{list-style:none;margin:0;padding:12px 10px 4px;min-height:64px}
.empty{color:var(--muted);font-size:13.5px;padding:6px 8px 14px;text-align:center}
.stop{
  display:grid;
  grid-template-columns:66px 16px minmax(0,1fr);
  gap:0 8px;
  padding-bottom:12px;
}
.gut{display:flex;flex-direction:column;align-items:flex-start;padding-top:2px}
.time{
  width:66px;
  border:1px solid transparent;
  background:transparent;
  border-radius:6px;
  padding:2px 0;
  font-family:'Bricolage Grotesque','Sarabun',system-ui,sans-serif;
  font-weight:700;font-size:15px;
  font-variant-numeric:tabular-nums;
}
.time:hover{border-color:var(--rule)}
.end{font-size:12px;color:var(--muted);padding-left:1px}
.step{display:flex;gap:3px;margin-top:5px}
.step button{
  border:1px solid var(--rule);background:transparent;border-radius:5px;
  font-size:11px;padding:1px 4px;color:var(--muted);line-height:1.4;
}
.step button:hover{color:var(--ink);border-color:var(--muted)}
.rail{position:relative}
.rail::before{
  content:'';position:absolute;left:50%;top:20px;bottom:-12px;width:3px;margin-left:-1.5px;
  background:var(--rule);
}
.stop:last-child .rail::before{display:none}
.dot{
  position:relative;z-index:1;
  display:block;width:16px;height:16px;margin-top:5px;padding:0;border-radius:50%;
}
.dot.core{background:var(--blue);border:2px solid var(--blue)}
.dot.option{background:var(--surface);border:2px dashed var(--muted)}
.dot:hover{transform:scale(1.15)}

.card{
  border:1px solid var(--rule);
  border-radius:8px;
  padding:9px 10px 8px;
  background:var(--surface);
  min-width:0;
}
.stop.is-option .card{border-style:dashed}
.stop{cursor:grab}
.stop.dragging{opacity:.35}
.drop-line{list-style:none;height:4px;border-radius:2px;background:var(--blue);margin:0 0 10px 0}
.ct{display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.ttl{font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.map{
  flex:none;color:var(--muted);display:inline-flex;padding:2px;border-radius:5px;
}
.map:hover{color:var(--blue)}
.area{font-size:12.5px;color:var(--muted);margin-top:1px}
.how{font-size:13.5px;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;line-height:1.5;padding:0 8px 0 6px;
  border:1px solid var(--rule);border-radius:999px;
}
.chip::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c)}
.m-bts{--c:var(--green)} .m-mrt{--c:var(--blue)} .m-arl{--c:var(--red)}
.m-taxi{--c:var(--amber)} .m-walk{--c:var(--muted)} .m-boat{--c:var(--teal)}
.meta{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.closed{color:var(--muted)}
.flag{
  margin:7px 0 0;padding:5px 8px;border-radius:6px;
  background:var(--warn-bg);color:var(--red);font-size:13px;font-weight:500;
}
.acts{display:flex;align-items:center;gap:4px;margin-top:8px;flex-wrap:wrap}
.ib{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:6px;
  border:1px solid var(--rule);background:transparent;color:var(--muted);padding:0;
}
.ib:hover{color:var(--ink);border-color:var(--muted)}
.ib.del:hover{color:var(--red);border-color:var(--red)}
.sp{flex:1}
.mv{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.mv select{
  border:1px solid var(--rule);background:var(--surface);border-radius:6px;
  padding:3px 4px;font-size:12.5px;max-width:112px;
}
.addrow{
  display:block;width:calc(100% - 20px);margin:0 10px 12px;
  border:2px dashed var(--rule);background:transparent;border-radius:8px;
  padding:8px;color:var(--muted);font-weight:500;
}
.addrow:hover{color:var(--ink);border-color:var(--muted)}

/* modal */
.ov{
  position:fixed;inset:0;background:rgba(8,14,20,.6);
  display:flex;align-items:flex-start;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 12px 24px;
  overflow:auto;z-index:50;
}
.panel{
  width:min(580px,100%);background:var(--surface);border-radius:12px;
  border:1px solid var(--rule);padding:18px 18px 16px;
}
.panel h3{
  margin:0 0 12px;font-family:'Bricolage Grotesque','Sarabun',system-ui,sans-serif;
  font-size:22px;font-weight:700;letter-spacing:-.01em;
}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:13.5px;font-weight:500}
.form input[type=text],.form input[type=time],.form select,.form textarea,.paste{
  width:100%;border:1px solid var(--rule);border-radius:7px;background:var(--paper);
  padding:7px 9px;font-weight:400;
}
.form textarea,.paste{resize:vertical}
.row3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
@media (max-width:480px){.row3{grid-template-columns:1fr 1fr}.row3 label:last-child{grid-column:1/-1}}
fieldset{border:1px solid var(--rule);border-radius:8px;margin:0;padding:6px 10px 8px}
legend{padding:0 4px;font-size:13.5px;font-weight:500}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px}
.form .checks label,.form label.chk{display:inline-flex;grid-template-columns:none;align-items:center;gap:6px;font-weight:400}
.form-actions{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:4px 12px;font-size:13.5px}
.tab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.paste{height:300px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.45;white-space:pre}
.note-sm{font-size:13px;color:var(--muted);margin:8px 0 0}

.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--head);color:var(--head-ink);padding:9px 14px;border-radius:9px;
  display:flex;gap:12px;align-items:center;z-index:60;max-width:92vw;
}
.toast[hidden]{display:none}
.toast button{background:transparent;border:1px solid var(--head-mute);color:var(--head-ink);border-radius:6px;padding:2px 9px}

@media print{
  .tools,.hint,.acts,.addrow,.step,.day-tools,.pool-wrap{display:none!important}
  .layout{display:block}
  body{background:#fff}
}
</style>

  <main class="layout">
    <section class="days" id="days" aria-label="Days"></section>
    <aside class="pool-wrap" id="pool" aria-label="Ideas"></aside>

</div>

<div id="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

function pickIn(o, lang){
  if(o == null) return '';
  if(typeof o !== 'object') return String(o);
  if(o[lang] !== undefined) return o[lang];
  var order = ['en','vi','th'];
  for(var i = 0; i < order.length; i++){ if(o[order[i]]) return o[order[i]]; }
  return '';
}

  var o = obj[f];

}

/* ---------- state ---------- */
function valid(s){
  return s && Array.isArray(s.days) && s.items && typeof s.items === 'object' &&
    s.lists && Array.isArray(s.lists.pool) &&
    s.days.every(function(d){ return Array.isArray(s.lists[d.id]); });
}
function mig(v, b){
  if(v && typeof v === 'object') return v;
  v = (v == null) ? '' : String(v);
  if(b && typeof b === 'object' && (b.en === v || v === 'Fri-Sun 11:00-00:00, Mon-Fri 17:00-00:00' && b.en.indexOf('Sat-Sun 11:00') === 0)) return b;
  return {en:v};
}
function migrate(s){
  var base = seed();
  s.days.forEach(function(d){
    var b = base.days.filter(function(x){ return x.id === d.id; })[0];
    ['title','stay','note'].forEach(function(f){ d[f] = mig(d[f], b && b[f]); });
  });
  Object.keys(s.items).forEach(function(id){
    var it = s.items[id], b = base.items[id];
    TEXTF.forEach(function(f){ it[f] = mig(it[f], b && b[f]); });
    if(!it.modes) it.modes = [];
    if(!it.closed) it.closed = [];
  });
  s.v = 2;
  if(!s.next) s.next = 1000;
  return s;
}
function normalize(s){
  if(!valid(s)) return null;
  return (s.v === 2) ? s : migrate(s);
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var s = normalize(JSON.parse(raw)); if(s) return s; }
    var old = localStorage.getItem(OLDKEY);
    if(old){ var s2 = normalize(JSON.parse(old)); if(s2) return s2; }
  }catch(e){}
  return seed();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

var S = load();
var undoStack = [];

function commit(msg, fn, withUndo){
  undoStack.push(JSON.stringify(S));
  if(undoStack.length > 40) undoStack.shift();
  fn();
  save();
  render();
  if(msg) toast(msg, withUndo);
}
function undo(){
  if(!undoStack.length) return;
  S = JSON.parse(undoStack.pop());
  save();
  render();
  toast(t('tUndone'));
}

/* ---------- helpers ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function dateOf(d){ return new Date(d.date + 'T00:00:00'); }
function dayLabel(d){
  var x = dateOf(d), w = dn(WD[x.getDay()]), m = MONS[LANG][x.getMonth()];
  return LANG === 'vi' ? (w + ', ' + x.getDate() + ' ' + m) : (w + ' ' + x.getDate() + ' ' + m);
}
function fmtDays(arr){
  var set = WEEK.filter(function(w){ return arr.indexOf(w) > -1; });
  if(set.join() === 'Mon,Tue,Wed,Thu,Fri') return t('monFri');
  return set.map(dn).join(', ');
}
function shiftT(tm, m){
  if(!tm) return '09:00';
  var p = tm.split(':'), x = parseInt(p[0],10)*60 + parseInt(p[1],10) + m;
  x = Math.max(0, Math.min(1439, x));
  return ('0'+Math.floor(x/60)).slice(-2) + ':' + ('0'+(x%60)).slice(-2);
}
function mins(tm){ if(!tm) return 99999; var p = tm.split(':'); return parseInt(p[0],10)*60 + parseInt(p[1],10); }
function mapUrl(it){
  var q = (pickIn(it.title, 'en') || pick(it.title)) + ' ' + (pickIn(it.area, 'en') || pick(it.area) || 'Bangkok');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}
function removeFromLists(id){
  Object.keys(S.lists).forEach(function(k){
    S.lists[k] = S.lists[k].filter(function(x){ return x !== id; });
  });
}
function moveItem(id, listId, index){
  removeFromLists(id);
  var arr = S.lists[listId];
  if(index == null || index > arr.length) index = arr.length;
  arr.splice(index, 0, id);
}
function listOf(id){
  var found = 'pool';
  Object.keys(S.lists).forEach(function(k){ if(S.lists[k].indexOf(id) > -1) found = k; });
  return found;
}
function dayById(id){ return S.days.filter(function(d){ return d.id === id; })[0]; }

/* ---------- render ---------- */
function stopHTML(it, listId){
  var day = dayById(listId);
  var flag = '';
  if(day && it.closed.length){
    var wd = WD[dateOf(day).getDay()];
    if(it.closed.indexOf(wd) > -1) flag = '<p class="flag">' + esc(t('flag', {wd: dn(wd)})) + '</p>';
  }
  var chips = (it.modes || []).map(function(m){ return '<span class="chip m-' + m + '">' + esc(t('m_' + m)) + '</span>'; }).join('');
  var hours = pick(it.hours), area = pick(it.area), how = pick(it.how), note = pick(it.note);
  var meta = [];
  if(hours) meta.push(esc(t('hours')) + esc(hours));
  if(it.closed.length) meta.push('<span class="closed">' + esc(t('closed', {days: fmtDays(it.closed)})) + '</span>');
  var opts = S.days.map(function(d){
    return '<option value="' + d.id + '"' + (d.id === listId ? ' selected' : '') + '>' + esc(dayLabel(d)) + '</option>';
  }).join('') + '<option value="pool"' + (listId === 'pool' ? ' selected' : '') + '>' + esc(t('ideasOpt')) + '</option>';
  var title = pick(it.title), tt = esc(title);
  return '<li class="stop ' + (it.kind === 'option' ? 'is-option' : 'is-core') + '" draggable="true" data-id="' + it.id + '">' +
    '<div class="gut">' +
      '<input class="time" type="time" step="900" value="' + esc(it.time) + '" data-id="' + it.id + '" aria-label="' + esc(t('aStart', {t: title})) + '">' +
      (it.end ? '<span class="end">' + esc(t('to', {end: it.end})) + '</span>' : '') +
      '<span class="step"><button data-act="step" data-d="-15" data-id="' + it.id + '" aria-label="' + esc(t('aEarlier')) + '">-15</button>' +
      '<button data-act="step" data-d="15" data-id="' + it.id + '" aria-label="' + esc(t('aLater')) + '">+15</button></span>' +
    '</div>' +
    '<div class="rail"><button class="dot ' + it.kind + '" data-act="dot" data-id="' + it.id + '" aria-label="' + esc(it.kind === 'option' ? t('aDotOpt') : t('aDotCore')) + '" title="' + esc(it.kind === 'option' ? t('tDotOpt') : t('tDotCore')) + '"></button></div>' +
    '<div class="card">' +
      '<div class="ct"><span class="ttl">' + tt + '</span>' +
        (it.nomap ? '' : '<a class="map" href="' + mapUrl(it) + '" target="_blank" rel="noopener" aria-label="' + esc(t('aMap', {t: title})) + '" title="' + esc(t('tMap')) + '">' + IC.pin + '</a>') +
      '</div>' +
      (area ? '<div class="area">' + esc(area) + '</div>' : '') +
      (how ? '<p class="how">' + esc(how) + '</p>' : '') +
      (chips ? '<div class="chips">' + chips + '</div>' : '') +
      (meta.length ? '<p class="meta">' + meta.join('. ') + '</p>' : '') +
      (note ? '<p class="meta">' + esc(note) + '</p>' : '') +
      flag +
      '<div class="acts">' +
        '<button class="ib" data-act="up" data-id="' + it.id + '" aria-label="' + esc(t('aUp')) + '">' + IC.up + '</button>' +
        '<button class="ib" data-act="down" data-id="' + it.id + '" aria-label="' + esc(t('aDown')) + '">' + IC.down + '</button>' +
        '<button class="ib" data-act="edit" data-id="' + it.id + '" aria-label="' + esc(t('aEdit', {t: title})) + '">' + IC.edit + '</button>' +
        '<button class="ib del" data-act="del" data-id="' + it.id + '" aria-label="' + esc(t('aDelete', {t: title})) + '">' + IC.trash + '</button>' +
        '<span class="sp"></span>' +
        '<label class="mv">' + esc(t('moveTo')) + '<select data-move="' + it.id + '">' + opts + '</select></label>' +
      '</div>' +
    '</div>' +
  '</li>';
}
function listHTML(listId, emptyMsg){
  var ids = S.lists[listId];
  var body = ids.map(function(id){ return stopHTML(S.items[id], listId); }).join('');
  if(!ids.length) body = '<li class="empty">' + esc(emptyMsg) + '</li>';
  return '<ul class="stops" data-list="' + listId + '">' + body + '</ul>';
}
function dayHTML(d){
  var x = dateOf(d), wd = dn(WD[x.getDay()]), mon = MONS[LANG][x.getMonth()];
  var stay = pick(d.stay), note = pick(d.note);
  return '<section class="day" aria-label="' + esc(dayLabel(d)) + '">' +
    '<header class="day-h">' +
      '<div class="dnum"><span class="n">' + x.getDate() + '</span><span class="m"><b>' + esc(wd) + '</b>' + esc(mon) + '</span></div>' +
      '<h2>' + esc(pick(d.title)) + '</h2>' +
      (stay ? '<p class="stay">' + esc(t('stay')) + esc(stay) + '</p>' : '') +
      (note ? '<p class="dnote">' + esc(note) + '</p>' : '') +
      '<div class="day-tools"><button class="mini" data-act="edit-day" data-day="' + d.id + '">' + esc(t('editDay')) + '</button>' +
      '<button class="mini" data-act="sort" data-day="' + d.id + '">' + esc(t('sort')) + '</button></div>' +
    '</header>' +
    listHTML(d.id, t('emptyDay')) +
    '<button class="addrow" data-act="add" data-day="' + d.id + '">' + esc(t('addToDay', {d: wd + ' ' + x.getDate()})) + '</button>' +
  '</section>';
}
function poolHTML(){
  return '<section class="day pool" aria-label="' + esc(t('ideas')) + '">' +
    '<header class="day-h"><h2>' + esc(t('ideas')) + '</h2><p class="dnote">' + esc(t('poolNote')) + '</p>' +
    '<div class="day-tools"><button class="mini" data-act="sort" data-day="pool">' + esc(t('sort')) + '</button></div></header>' +
    listHTML('pool', t('emptyPool')) +
    '<button class="addrow" data-act="add" data-day="pool">' + esc(t('addIdea')) + '</button>' +
  '</section>';
}
function summary(){
  var core = 0, opt = 0;
  S.days.forEach(function(d){ S.lists[d.id].forEach(function(id){ if(S.items[id].kind === 'option') opt++; else core++; }); });
  return t('summary', {core: core, opt: opt, pool: S.lists.pool.length});
}
function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = t('pageTitle');
  Array.prototype.forEach.call(document.querySelectorAll('[data-i]'), function(el){ el.textContent = t(el.dataset.i); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function(b){
    b.setAttribute('aria-pressed', b.dataset.lang === LANG ? 'true' : 'false');
  });
  var g = document.getElementById('langGroup');
  if(g) g.setAttribute('aria-label', t('langLabel'));
}
function render(){
  document.getElementById('days').innerHTML = S.days.map(dayHTML).join('');
  document.getElementById('pool').innerHTML = poolHTML();
  document.getElementById('summary').textContent = summary();
  document.getElementById('undoBtn').disabled = !undoStack.length;
}

/* ---------- toast ---------- */
var toastTimer = null;
function toast(msg, withUndo){
  var el = document.getElementById('toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (withUndo ? '<button data-act="undo">' + esc(t('undo')) + '</button>' : '');
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.hidden = true; }, 4500);
}

/* ---------- modal ---------- */
var modalRoot = document.getElementById('modal');
var lastFocus = null;
var editing = null;
function openModal(html){
  lastFocus = document.activeElement;
  modalRoot.innerHTML = '<div class="ov"><div class="panel" role="dialog" aria-modal="true">' + html + '</div></div>';
  modalRoot.hidden = false;
  var f = modalRoot.querySelector('input[type=text],textarea,select,button');
  if(f) f.focus();
}
function closeModal(){
  modalRoot.hidden = true;
  modalRoot.innerHTML = '';
  editing = null;
  if(lastFocus && lastFocus.focus){ try{ lastFocus.focus(); }catch(e){} }
}

function dayOptions(sel){
  return S.days.map(function(d){
    return '<option value="' + d.id + '"' + (d.id === sel ? ' selected' : '') + '>' + esc(dayLabel(d)) + '</option>';
  }).join('') + '<option value="pool"' + (sel === 'pool' ? ' selected' : '') + '>' + esc(t('ideasOpt')) + '</option>';
}
function checks(name, all, labelFn, chosen){
  return '<div class="checks">' + all.map(function(k){
    return '<label><input type="checkbox" name="' + name + '" value="' + k + '"' + (chosen.indexOf(k) > -1 ? ' checked' : '') + '>' + esc(labelFn(k)) + '</label>';
  }).join('') + '</div>';
}
function openEditor(id, dayId){
  var isNew = !id;
  var it = isNew ? {title:'', time:'', end:'', area:'', how:'', modes:[], hours:'', kind:'core', closed:[], note:'', nomap:false}
                 : S.items[id];
  var cur = isNew ? dayId : listOf(id);
  editing = {id:id, day:cur, isNew:isNew};
  openModal(
    '<form id="edForm" class="form" autocomplete="off">' +
      '<h3>' + esc(isNew ? t('eAdd') : t('eEdit')) + '</h3>' +
      '<p class="note-sm">' + esc(t('langNote')) + '</p>' +
      '<label>' + esc(t('name')) + '<input type="text" name="title" required value="' + esc(pick(it.title)) + '"></label>' +
      '<div class="row3">' +
        '<label>' + esc(t('start')) + '<input type="time" name="time" step="900" value="' + esc(it.time) + '"></label>' +
        '<label>' + esc(t('end')) + '<input type="time" name="end" step="900" value="' + esc(it.end) + '"></label>' +
        '<label>' + esc(t('day')) + '<select name="day">' + dayOptions(cur) + '</select></label>' +
      '</div>' +
      '<label>' + esc(t('area')) + '<input type="text" name="area" value="' + esc(pick(it.area)) + '" placeholder="' + esc(t('areaPh')) + '"></label>' +
      '<label>' + esc(t('how')) + '<textarea name="how" rows="3" placeholder="' + esc(t('howPh')) + '">' + esc(pick(it.how)) + '</textarea></label>' +
      '<fieldset><legend>' + esc(t('transport')) + '</legend>' + checks('modes', MODEKEYS, function(k){ return t('m_' + k); }, it.modes || []) + '</fieldset>' +
      '<label>' + esc(t('hoursLbl')) + '<input type="text" name="hours" value="' + esc(pick(it.hours)) + '" placeholder="' + esc(t('hoursPh')) + '"></label>' +
      '<fieldset><legend>' + esc(t('closedOn')) + '</legend>' + checks('closed', WEEK, dn, it.closed || []) + '</fieldset>' +
      '<label>' + esc(t('notes')) + '<input type="text" name="note" value="' + esc(pick(it.note)) + '"></label>' +
      '<div class="row2">' +
        '<label>' + esc(t('type')) + '<select name="kind"><option value="core"' + (it.kind === 'core' ? ' selected' : '') + '>' + esc(t('kCore')) + '</option><option value="option"' + (it.kind === 'option' ? ' selected' : '') + '>' + esc(t('kOpt')) + '</option></select></label>' +
        '<label class="chk"><input type="checkbox" name="map"' + (it.nomap ? '' : ' checked') + '>' + esc(t('mapLink')) + '</label>' +
      '</div>' +
      '<div class="form-actions">' +
        (isNew ? '' : '<button type="button" class="btn danger" data-act="del-modal">' + esc(t('del')) + '</button>') +
        '<span class="sp"></span>' +
        '<button type="button" class="btn" data-act="close">' + esc(t('cancel')) + '</button>' +
        '<button type="submit" class="btn primary">' + esc(t('save')) + '</button>' +
      '</div>' +
    '</form>'
  );
}
function saveEditor(form){
  var fd = new FormData(form);
  var title = (fd.get('title') || '').toString().trim();
  if(!title){ form.elements.title.focus(); return; }
  var texts = {
    title: title,
    area: (fd.get('area') || '').toString().trim(),
    how: (fd.get('how') || '').toString().trim(),
    hours: (fd.get('hours') || '').toString().trim(),
    note: (fd.get('note') || '').toString().trim()
  };
  var plain = {
    time: (fd.get('time') || '').toString(),
    end: (fd.get('end') || '').toString(),
    modes: fd.getAll('modes'),
    closed: fd.getAll('closed'),
    kind: fd.get('kind') === 'option' ? 'option' : 'core',
    nomap: !fd.get('map')
  };
  var day = fd.get('day');
  var ed = editing;
  commit(ed.isNew ? t('tAdded') : t('tSaved'), function(){
    var it;
    if(ed.isNew){
      var id = 'i' + (S.next++);
      it = {id:id};
      S.items[id] = it;
      S.lists[day].push(id);
    }else{
      it = S.items[ed.id];
      if(day !== ed.day) moveItem(ed.id, day);
    }
    Object.keys(plain).forEach(function(k){ it[k] = plain[k]; });
    Object.keys(texts).forEach(function(k){ setText(it, k, texts[k]); });
  });
  closeModal();
}
function openDayEditor(dayId){
  var d = dayById(dayId);
  editing = {dayId:dayId};
  openModal(
    '<form id="dayForm" class="form" autocomplete="off">' +
      '<h3>' + esc(t('dayEditTitle', {d: dayLabel(d)})) + '</h3>' +
      '<p class="note-sm">' + esc(t('langNote')) + '</p>' +
      '<label>' + esc(t('dayTitle')) + '<input type="text" name="title" value="' + esc(pick(d.title)) + '"></label>' +
      '<label>' + esc(t('dayStay')) + '<input type="text" name="stay" value="' + esc(pick(d.stay)) + '"></label>' +
      '<label>' + esc(t('dayNote')) + '<input type="text" name="note" value="' + esc(pick(d.note)) + '"></label>' +
      '<div class="form-actions"><span class="sp"></span>' +
        '<button type="button" class="btn" data-act="close">' + esc(t('cancel')) + '</button>' +
        '<button type="submit" class="btn primary">' + esc(t('save')) + '</button></div>' +
    '</form>'
  );
}

/* ---------- export ---------- */
function toText(){
  var out = [t('exTitle'), ''];
  function line(id){
    var it = S.items[id];
    var tm = it.time ? (it.time + (it.end ? '-' + it.end : '')) : '';
    var area = pick(it.area), how = pick(it.how), hours = pick(it.hours), note = pick(it.note);
    out.push('  ' + (tm + '            ').slice(0, 12) + pick(it.title) + (it.kind === 'option' ? ' ' + t('exOption') : '') + (area ? ', ' + area : ''));
    if(how) out.push('              ' + t('exHow') + ': ' + how);
    if(hours) out.push('              ' + t('exHours') + ': ' + hours);
    if(it.closed.length) out.push('              ' + t('exClosed') + ': ' + fmtDays(it.closed));
    if(note) out.push('              ' + t('exNote') + ': ' + note);
  }
  S.days.forEach(function(d){
    var ti = pick(d.title), st = pick(d.stay), nt = pick(d.note);
    out.push(dayLabel(d) + (ti ? ': ' + ti : ''));
    if(st) out.push('  ' + t('exStay') + ': ' + st);
    if(nt) out.push('  ' + nt);
    S.lists[d.id].forEach(line);
    out.push('');
  });
  out.push(t('exIdeas'));
  S.lists.pool.forEach(line);
  return out.join('\n');
}
function openBackup(tab){
  var body;
  if(tab === 'json'){
    body = '<textarea class="paste" id="bk" readonly>' + esc(JSON.stringify(S)) + '</textarea>' +
      '<p class="note-sm">' + esc(t('bkJsonNote')) + '</p>' +
      '<div class="form-actions"><span class="sp"></span><button class="btn primary" data-act="copy">' + esc(t('copy')) + '</button></div>';
  }else if(tab === 'restore'){
    body = '<textarea class="paste" id="bk" placeholder="' + esc(t('bkPaste')) + '"></textarea>' +
      '<p class="note-sm">' + esc(t('bkRestoreNote')) + '</p>' +
      '<div class="form-actions"><span class="sp"></span><button class="btn primary" data-act="restore">' + esc(t('restoreBtn')) + '</button></div>';
  }else{
    tab = 'text';
    body = '<textarea class="paste" id="bk" readonly>' + esc(toText()) + '</textarea>' +
      '<div class="form-actions"><span class="sp"></span><button class="btn primary" data-act="copy">' + esc(t('copy')) + '</button></div>';
  }
  function tb(k, label){ return '<button class="tab" role="tab" aria-selected="' + (k === tab) + '" data-act="tab" data-tab="' + k + '">' + esc(label) + '</button>'; }
  openModal(
    '<h3>' + esc(t('bkTitle')) + '</h3>' +
    '<div class="tabs" role="tablist">' + tb('text', t('tabText')) + tb('json', t('tabJson')) + tb('restore', t('tabRestore')) + '</div>' +
    body +
    '<div class="form-actions"><span class="sp"></span><button class="btn" data-act="close">' + esc(t('close')) + '</button></div>'
  );
}
function copyBk(){
  var ta = document.getElementById('bk');
  if(!ta) return;
  ta.focus(); ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(function(){ toast(t('copied')); }, function(){ toast(t('copyKeys')); });
    return;
  }
  toast(ok ? t('copied') : t('copyKeys'));
}
function restoreBk(){
  var ta = document.getElementById('bk');
  var s;
  try{ s = normalize(JSON.parse(ta.value)); }catch(e){ s = null; }
  if(!s){ toast(t('badCode')); return; }
  commit(t('restored'), function(){ S = s; }, true);
  closeModal();
}

/* ---------- actions ---------- */
document.addEventListener('click', function(e){
  if(e.target.classList && e.target.classList.contains('ov')){ closeModal(); return; }
  var lb = e.target.closest('[data-lang]');
  if(lb){
    LANG = lb.dataset.lang;
    try{ localStorage.setItem(LANGKEY, LANG); }catch(x){}
    applyStatic();
    render();
    return;
  }
  var b = e.target.closest('[data-act]');
  if(!b) return;
  var act = b.dataset.act, id = b.dataset.id, day = b.dataset.day;
  if(act === 'add'){ openEditor(null, day); }
  else if(act === 'edit'){ openEditor(id); }
  else if(act === 'edit-day'){ openDayEditor(day); }
  else if(act === 'close'){ closeModal(); }
  else if(act === 'undo'){ undo(); }
  else if(act === 'del'){
    commit(t('tDeleted'), function(){ removeFromLists(id); delete S.items[id]; }, true);
  }
  else if(act === 'del-modal'){
    var did = editing && editing.id;
    closeModal();
    if(did) commit(t('tDeleted'), function(){ removeFromLists(did); delete S.items[did]; }, true);
  }
  else if(act === 'dot'){
    commit('', function(){ S.items[id].kind = S.items[id].kind === 'option' ? 'core' : 'option'; });
  }
  else if(act === 'step'){
    var dlt = parseInt(b.dataset.d, 10);
    commit('', function(){
      var it = S.items[id];
      it.time = shiftT(it.time, dlt);
      if(it.end) it.end = shiftT(it.end, dlt);
    });
  }
  else if(act === 'up' || act === 'down'){
    var l = listOf(id), arr = S.lists[l], i = arr.indexOf(id);
    var j = act === 'up' ? i - 1 : i + 1;
    if(j >= 0 && j < arr.length){
      commit('', function(){ var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; });
    }
  }
  else if(act === 'sort'){
    commit(t('tSorted'), function(){
      var arr2 = S.lists[day].map(function(x, idx){ return {x:x, k:mins(S.items[x].time), i:idx}; });
      arr2.sort(function(a, c){ return a.k - c.k || a.i - c.i; });
      S.lists[day] = arr2.map(function(o){ return o.x; });
    });
  }
  else if(act === 'backup'){ openBackup('text'); }
  else if(act === 'tab'){ openBackup(b.dataset.tab); }
  else if(act === 'copy'){ copyBk(); }
  else if(act === 'restore'){ restoreBk(); }
  else if(act === 'reset'){
    openModal(
      '<h3>' + esc(t('resetTitle')) + '</h3>' +
      '<p>' + esc(t('resetBody')) + '</p>' +
      '<div class="form-actions"><span class="sp"></span><button class="btn" data-act="close">' + esc(t('resetKeep')) + '</button>' +
      '<button class="btn danger" data-act="reset-go">' + esc(t('resetGo')) + '</button></div>'
    );
  }
  else if(act === 'reset-go'){
    closeModal();
    commit(t('tReset'), function(){ S = seed(); }, true);
  }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if(el.matches && el.matches('input.time')){
    var id = el.dataset.id;
    commit('', function(){ S.items[id].time = el.value; });
  }else if(el.matches && el.matches('select[data-move]')){
    var mid = el.dataset.move, to = el.value;
    commit(t('tMoved'), function(){ moveItem(mid, to); });
  }
});

document.addEventListener('submit', function(e){
  var f = e.target;
  if(f.id === 'edForm'){ e.preventDefault(); saveEditor(f); }
  else if(f.id === 'dayForm'){
    e.preventDefault();
    var fd = new FormData(f), dayId = editing.dayId;
    commit(t('tSaved'), function(){
      var d = dayById(dayId);
      setText(d, 'title', (fd.get('title') || '').toString().trim());
      setText(d, 'stay', (fd.get('stay') || '').toString().trim());
      setText(d, 'note', (fd.get('note') || '').toString().trim());
    });
    closeModal();
  }
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && !modalRoot.hidden) closeModal();
});

/* ---------- drag and drop ---------- */
var dragId = null;
function dropIndex(ul, y){
  var els = Array.prototype.slice.call(ul.querySelectorAll(':scope > .stop:not(.dragging)'));
  for(var i = 0; i < els.length; i++){
    var r = els[i].getBoundingClientRect();
    if(y < r.top + r.height / 2) return {index:i, ref:els[i]};
  }
  return {index:els.length, ref:null};
}
function clearLines(){
  Array.prototype.forEach.call(document.querySelectorAll('.drop-line'), function(n){ n.remove(); });
}
document.addEventListener('dragstart', function(e){
  var li = e.target.closest && e.target.closest('.stop');
  if(!li) return;
  dragId = li.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragId); }catch(x){}
  setTimeout(function(){ li.classList.add('dragging'); }, 0);
});
document.addEventListener('dragover', function(e){
  if(!dragId) return;
  var ul = e.target.closest && e.target.closest('.stops');
  if(!ul) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  var pos = dropIndex(ul, e.clientY);
  clearLines();
  var line = document.createElement('li');
  line.className = 'drop-line';
  ul.insertBefore(line, pos.ref);
});
document.addEventListener('drop', function(e){
  if(!dragId) return;
  var ul = e.target.closest && e.target.closest('.stops');
  if(!ul) return;
  e.preventDefault();
  var pos = dropIndex(ul, e.clientY);
  var id = dragId, to = ul.dataset.list;
  dragId = null;
  clearLines();
  commit(t('tMoved'), function(){ moveItem(id, to, pos.index); });
});
document.addEventListener('dragend', function(){
  dragId = null;
  clearLines();
  Array.prototype.forEach.call(document.querySelectorAll('.dragging'), function(n){ n.classList.remove('dragging'); });
});

applyStatic();
render();
})();

</script>
